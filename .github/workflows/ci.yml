name: CI

on:
  push:
    branches: [main]   # также проверяем main, чтобы видеть статус до тега
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod   # версия Go берётся из go.mod
          cache: true              # кэш модулей и build cache

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test -race -coverprofile=coverage.out ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9   # актуальная мажорная версия
        with:
          version: v2.15.0        # последняя стабильная версия линтера
          args: --timeout=5m

      - name: Build check
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/core-api
