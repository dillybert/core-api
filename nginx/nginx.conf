user  nginx;
worker_processes auto;

# поднять лимит fd, чтобы worker_connections работали как задумано
worker_rlimit_nofile 8192;

error_log /dev/stderr warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Docker embedded DNS — динамический резолв upstream'ов
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format main '$remote_addr - $host [$time_local] "$request" '
                    '$status $body_bytes_sent rt=$request_time '
                    'urt=$upstream_response_time "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;
    client_max_body_size 10m;

    # готово к использованию: раскомментируйте limit_req в default.conf.template
    limit_req_zone  $binary_remote_addr zone=api_rl:10m   rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=api_conn:10m;

    include /etc/nginx/conf.d/*.conf;
}
